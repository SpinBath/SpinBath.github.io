<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="assets/images/favicon.png" />
    <link rel="stylesheet" href="css/styles.css">
    <title>David Sánchez | PORTFOLIO</title>
</head>

<body>
    <div id="popup" class="popup">
        <div class="popup-content">
            <h2>DAVID SÁNCHEZ | PORTFOLIO</h2>
            <div id="load-bar" class="load-bar"></div>
        </div>
    </div>

    <div id="container">
        <aside id="contact" aria-label="Social media links">
            <a href="https://github.com/SpinBath" aria-label="GitHub">
                <img id="github" alt="GitHub" />
            </a>
            <a href="https://www.linkedin.com/in/d-vid/" aria-label="LinkedIn">
                <img id="linkedin" alt="LinkedIn" />
            </a>
            <a href="mailto:david.sanchezalb@gmail.com" aria-label="Email">
                <img id="gmail" alt="Email" />
            </a>
        </aside>

        <main id="main-div">
            <div id="options">
                <div class="theme-btn" onclick="changeTheme('light')">
                    <div class="light-box"></div>
                    <div class="text">LIGHT</div>
                </div>
                <div class="theme-btn" onclick="changeTheme('dark')">
                    <div class="dark-box"></div>
                    <div class="text">DARK</div>
                </div>
                <div id="div-language-opt">
                    <select id="select-lang" aria-label="Language selector">
                        <option value="es">ES</option>
                        <option value="en">EN</option>
                    </select>
                </div>
            </div>

            <header id="about-me">
                <p id="name" data-i18n="about.name">DAVID SÁNCHEZ</p>
                <p id="job" data-i18n="about.role">PYTHON DEVELOPER</p>
                <p id="info" data-i18n="about.info">
                    Graduado en Ciberseguridad en Entornos de la Tecnología de la Información con el interés de poder
                    desarrollar mi carrera profesional en el desarrollo de software y la ciberseguridad.
                </p>
                <p id="cv">
                    <a href="assets/docs/CV - David Sánchez Albarrán.pdf" target="_blank" download>
                        <button data-i18n="about.cv">Descargar CV</button>
                    </a>
                </p>
            </header>

            <section id="experience" aria-labelledby="experience-title">
                <p id="experience-title" class="title-section" data-i18n="sections.experience">EXPERIENCE</p>
                <div id="experience-list" class="section-list"></div>
            </section>

            <section id="projects" aria-labelledby="projects-title">
                <p id="projects-title" class="title-section" data-i18n="sections.projects">PROJECTS</p>
                <div id="projects-list" class="section-list"></div>
            </section>

            <section id="education" aria-labelledby="education-title">
                <p id="education-title" class="title-section" data-i18n="sections.education">EDUCATION</p>
                <div id="education-list" class="section-list"></div>
            </section>

            <section id="contact-url" aria-labelledby="contact-title">
                <p id="contact-title" class="title-section" data-i18n="sections.contact">CONTACT</p>
                <div id="contact-list" class="section-list"></div>
            </section>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
